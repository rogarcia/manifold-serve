apiVersion: v1
kind: Service
metadata:
  name: router
spec:
  selector:
    app.kubernetes.io/name: router
  ports:
    - name: http
      port: 8000
---
# One replica: the gate and the prefix index are in memory, and two routers would split both.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: router
    spec:
      priorityClassName: manifold-serving
      automountServiceAccountToken: false
      containers:
        - name: router
          image: manifold-serve:dev
          command: [python, -m, manifold.router]
          env:
            - name: MANIFOLD_BACKENDS
              value: http://vllm-core-0.vllm.manifold.svc.cluster.local:8000,http://vllm-burst-0.vllm.manifold.svc.cluster.local:8000
            - name: MANIFOLD_HOST
              value: 0.0.0.0
            - name: MANIFOLD_INITIAL_STATE
              value: "off"
            - name: MANIFOLD_POLICY
              value: prefix_aware
            - name: MANIFOLD_TOKENIZER
              value: Qwen/Qwen3.5-9B
            - name: MANIFOLD_BLOCK_TOKENS
              value: "528"
            - name: MANIFOLD_CAP_INTERACTIVE
              value: "96"
            - name: MANIFOLD_CAP_BATCH
              value: "64"
            # 300 s, the longest start the startupProbe allows (60 failures at 5 s).
            - name: MANIFOLD_HOLD_INTERACTIVE_S
              value: "300"
            - name: MANIFOLD_HOLD_BATCH_S
              value: "600"
            - name: MANIFOLD_MAX_ATTEMPTS
              value: "3"
            - name: MANIFOLD_DOWN_S
              value: "5"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
