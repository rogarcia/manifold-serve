# Two vLLM replicas, one per GPU, for router experiments on your own two-GPU box.
# RunPod pods cannot run Docker; on RunPod use bench/m1/serve.sh instead.
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# Ports bind to loopback because VLLM_SERVER_DEV_MODE exposes /reset_prefix_cache and other dev
# endpoints. Then point the router at http://localhost:8001,http://localhost:8002

x-vllm: &vllm
  image: vllm/vllm-openai:v0.31.0
  environment:
    VLLM_SERVER_DEV_MODE: "1"
  volumes:
    - hf-cache:/root/.cache/huggingface

x-args: &args >
  --model Qwen/Qwen3.5-9B
  --language-model-only
  --default-chat-template-kwargs '{"enable_thinking": false}'
  --enable-prefix-caching
  --max-model-len 32768
  --max-num-batched-tokens 8192
  --gpu-memory-utilization 0.90
  --seed 0

services:
  vllm-0:
    <<: *vllm
    command: *args
    ports: ["127.0.0.1:8001:8000"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, device_ids: ["0"], capabilities: [gpu] }]

  vllm-1:
    <<: *vllm
    command: *args
    ports: ["127.0.0.1:8002:8000"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, device_ids: ["1"], capabilities: [gpu] }]

volumes:
  hf-cache:
