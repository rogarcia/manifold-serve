[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manifold-serve"
version = "0.1.0"
description = "Cache-aware request routing, autoscaling, and canary deployments for LLM inference fleets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rodrigo Garcia da Silva" }]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["manifold"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
